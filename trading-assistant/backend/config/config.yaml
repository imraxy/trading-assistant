# AI Trading Assistant Configuration
# This is an example configuration file
# Copy to config.production.yaml or config.development.yaml for environment-specific settings

database:
  url: "postgresql://postgres:password@localhost:5432/trading_assistant"
  pool_size: 10
  max_overflow: 20
  echo: false  # Set to true for SQL logging in development

bybit:
  testnet: true  # Set to false for production
  base_url: "https://api-testnet.bybit.com"
  # API credentials should be set via environment variables:
  # BYBIT_API_KEY and BYBIT_API_SECRET

openai:
  model: "gpt-4"
  max_tokens: 1000
  temperature: 0.1
  # API key should be set via environment variable:
  # OPENAI_API_KEY

app:
  debug: true
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  analysis_interval: 30  # seconds
  max_positions: 500
  data_retention_days: 90

security:
  algorithm: "HS256"
  access_token_expire_minutes: 30
  # Secret key and encryption key should be set via environment variables:
  # SECURITY_SECRET_KEY and SECURITY_ENCRYPTION_KEY 