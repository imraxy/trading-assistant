# Development Configuration for Local Testing

database:
  url: "sqlite:///./trading_assistant.db"  # SQLite for local development
  pool_size: 5
  max_overflow: 10
  echo: true  # Enable SQL logging in development

bybit:
  testnet: true
  base_url: "https://api-testnet.bybit.com"
  # API credentials should be set via environment variables:
  # BYBIT_API_KEY and BYBIT_API_SECRET

openai:
  model: "gpt-4"
  max_tokens: 1000
  temperature: 0.1
  # API key should be set via environment variable:
  # OPENAI_API_KEY

app:
  debug: true
  host: "127.0.0.1"
  port: 8000
  log_level: "DEBUG"
  analysis_interval: 30
  max_positions: 500
  data_retention_days: 90

security:
  secret_key: "local-development-secret-key-not-for-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30 