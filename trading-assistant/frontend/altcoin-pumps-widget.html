<!DOCTYPE html>
<html lang="en" data-contrast="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Potential Altcoin Pumps Widget</title>
  <!--
    Potential Altcoin Pumps Widget
    - Self-contained HTML/CSS/JS widget. No external frameworks, no build steps.
    - Data sources: CoinGecko public endpoints (prices, volumes, market cap, OHLC proxies).
    - Timeframes: Hourly (H1), Daily (D1), Weekly (W1).
    - Scoring model: Price+Volume only (derivatives optional OFF by design per user selection).
    - CTA: comprehensive-portfolio-dashboard.html?symbol=SYMBOL
    - Persistence: session-only for pin/hide (future).
    - Accessibility: ARIA roles, keyboard navigation (tabs, sorting), high-contrast support.
    - Performance: request coalescing, sessionStorage caching, SWR, jitter backoff, memoized indicators.

    Integration:
    - Open this file directly in a browser OR embed the .apw-widget section inside an existing page.
    - Theming via CSS variables below.

    Security:
    - No eval, sanitized text inserts, CORS-safe GETs to CoinGecko only.
  -->
  <style>
    :root {
      --apw-bg: #0f172a;           /* slate-900 */
      --apw-card: #111827;         /* gray-900 */
      --apw-border: #1f2937;       /* gray-800 */
      --apw-text: #e5e7eb;         /* gray-200 */
      --apw-muted: #9ca3af;        /* gray-400 */
      --apw-accent: #2563eb;       /* blue-600 */
      --apw-green: #10b981;        /* emerald-500 */
      --apw-red: #ef4444;          /* red-500 */
      --apw-yellow: #f59e0b;       /* amber-500 */
      --apw-cta: #22c55e;          /* green-500 */
      --apw-cta-hover: #16a34a;    /* green-600 */

      --apw-radius: 10px;
      --apw-font: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --apw-maxw: 420px;
      --apw-minw: 320px;
      --apw-shadow: 0 8px 18px rgba(0,0,0,0.35);
      --apw-focus: 0 0 0 3px rgba(37,99,235,0.45);
    }
    html[data-contrast="high"] {
      --apw-bg: #000000;
      --apw-card: #0d0d0d;
      --apw-border: #262626;
      --apw-text: #ffffff;
      --apw-muted: #d4d4d4;
      --apw-accent: #60a5fa;
      --apw-green: #22c55e;
      --apw-red: #f87171;
      --apw-yellow: #fbbf24;
      --apw-cta: #22c55e;
      --apw-cta-hover: #16a34a;
    }

    body { margin: 0; padding: 0; background: var(--apw-bg); color: var(--apw-text); font-family: var(--apw-font); }
    .apw-widget {
      margin: 16px auto;
      width: min(100%, var(--apw-maxw));
      min-width: var(--apw-minw);
      background: var(--apw-card);
      border: 1px solid var(--apw-border);
      border-radius: 10px;
      box-shadow: var(--apw-shadow);
      overflow: hidden;
      outline: none;
    }

    .apw-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--apw-border); background: linear-gradient(180deg, rgba(37,99,235,0.08), transparent); }
    .apw-title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .apw-badge { font-size: 11px; color: var(--apw-muted); }
    .apw-actions { display: flex; gap: 6px; }
    .apw-btn { border: 1px solid var(--apw-border); background: #0b1220; color: var(--apw-text); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .apw-btn:hover { border-color: var(--apw-accent); }
    .apw-btn:focus-visible { box-shadow: var(--apw-focus); outline: none; }

    .apw-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border-bottom: 1px solid var(--apw-border); background: #0c1322; }
    .apw-tab { padding: 8px; border-radius: 8px; border: 1px solid var(--apw-border); text-align: center; font-size: 13px; background:#0b1220; cursor: pointer; color: var(--apw-muted); }
    .apw-tab[aria-selected="true"] { background: rgba(37,99,235,0.15); color: #fff; border-color: var(--apw-accent); }
    .apw-tab:focus-visible { box-shadow: var(--apw-focus); outline: none; }

    .apw-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--apw-border); font-size: 12px; color: var(--apw-muted); }
    .apw-select { background: #0b1220; color: var(--apw-text); border: 1px solid var(--apw-border); border-radius: 8px; padding: 4px 8px; font-size: 12px; }
    .apw-select:focus-visible { box-shadow: var(--apw-focus); outline: none; }

    .apw-list { display: grid; gap: 8px; padding: 8px 8px 12px; min-height: 120px; }
    .apw-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; border: 1px solid var(--apw-border); border-radius: 10px; padding: 10px; background: #0a0f1c; }
    .apw-row:hover { border-color: rgba(37,99,235,0.35); }
    .apw-main { display: grid; gap: 6px; }
    .apw-topline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .apw-coin { display: flex; align-items: baseline; gap: 6px; font-weight: 700; }
    .apw-symbol { color: var(--apw-muted); font-size: 12px; font-weight: 600; }
    .apw-source { color: var(--apw-muted); font-size: 11px; padding: 2px 6px; border: 1px solid var(--apw-border); border-radius: 999px; }
    .apw-score { margin-left: auto; font-weight: 800; font-size: 14px; color: #fff; }
    .apw-score[data-band="watch"] { color: #a3e635; }
    .apw-score[data-band="strong"] { color: var(--apw-green); }
    .apw-score[data-band="extreme"] { color: #f97316; }

    .apw-midline { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
    .apw-spark { border: 1px dashed var(--apw-border); border-radius: 8px; padding: 6px; display: grid; gap: 4px; }
    .apw-spark svg { width: 100%; height: 38px; display: block; }
    .apw-stats { display: grid; gap: 6px; font-size: 12px; color: var(--apw-muted); }
    .apw-stat { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .apw-stat strong { color: var(--apw-text); }

    .apw-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .apw-tag { font-size: 11px; color: var(--apw-text); background: #0d1424; border: 1px solid var(--apw-border); border-radius: 999px; padding: 2px 8px; }
    .apw-risk[data-level="Low"] { color: var(--apw-green); }
    .apw-risk[data-level="Medium"] { color: var(--apw-yellow); }
    .apw-risk[data-level="High"] { color: var(--apw-red); }

    .apw-side { display: grid; gap: 8px; justify-items: end; }
    .apw-cta { display: inline-flex; align-items: center; gap: 6px; background: var(--apw-cta); color: #001a0a; padding: 8px 10px; border-radius: 8px; border: 1px solid #064e3b; font-size: 12px; text-decoration: none; font-weight: 700; }
    .apw-cta:hover { background: var(--apw-cta-hover); color: #001a0a; }
    .apw-cta:focus-visible { box-shadow: var(--apw-focus); outline: none; }

    .apw-footer { border-top: 1px solid var(--apw-border); padding: 10px 12px; font-size: 11px; color: var(--apw-muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .apw-disclaimer { opacity: 0.9; }
    .apw-stale { color: #f59e0b; }
    .apw-error { color: var(--apw-red); }

    .apw-empty { border: 1px dashed var(--apw-border); border-radius: 10px; padding: 14px; text-align: center; color: var(--apw-muted); background: #0b1220; }
  </style>
</head>
<body>
  <section class="apw-widget" id="apw-root" role="region" aria-labelledby="apw-heading" tabindex="-1">
    <header class="apw-header">
      <div class="apw-title">
        <span aria-hidden="true">🚀</span>
        <span id="apw-heading">Potential Altcoin Pumps</span>
        <span class="apw-badge" id="apw-last-updated" aria-live="polite">(initializing...)</span>
      </div>
      <div class="apw-actions">
        <button class="apw-btn" id="apw-refresh-btn" type="button" aria-label="Refresh data">Refresh</button>
        <button class="apw-btn" id="apw-contrast-btn" type="button" aria-label="Toggle high contrast">Contrast</button>
      </div>
    </header>

    <nav class="apw-tabs" role="tablist" aria-label="Timeframes">
      <button class="apw-tab" role="tab" id="tab-h1" aria-controls="panel-h1" aria-selected="true" data-tf="h1">Hourly</button>
      <button class="apw-tab" role="tab" id="tab-d1" aria-controls="panel-d1" aria-selected="false" data-tf="d1">Daily</button>
      <button class="apw-tab" role="tab" id="tab-w1" aria-controls="panel-w1" aria-selected="false" data-tf="w1">Weekly</button>
    </nav>

    <div class="apw-toolbar">
      <div>
        <label for="apw-sort-select">Sort:</label>
        <select id="apw-sort-select" class="apw-select" aria-label="Sort results">
          <option value="score" selected>Composite Score</option>
          <option value="risk">Risk (Low→High)</option>
          <option value="volume">24h Volume</option>
          <option value="price">Price</option>
          <option value="symbol">Symbol</option>
        </select>
      </div>
      <div id="apw-state" class="apw-badge">Ready</div>
    </div>

    <section id="panel-h1" class="apw-list" role="tabpanel" aria-labelledby="tab-h1"></section>
    <section id="panel-d1" class="apw-list" role="tabpanel" aria-labelledby="tab-d1" hidden></section>
    <section id="panel-w1" class="apw-list" role="tabpanel" aria-labelledby="tab-w1" hidden></section>

    <footer class="apw-footer">
      <div class="apw-disclaimer">Informational only. Not financial advice.</div>
      <div class="apw-badge">
        <span id="apw-cache-status" class=""></span>
        <span id="apw-error" class="apw-error" hidden></span>
      </div>
    </footer>
  </section>

  <!-- Inline JSON Schema (reference) -->

{ "title": "Altcoin Pump Entry", "type": "object" }
  </script>

  <script>
  (function () {
    'use strict';

    // Elements
    const root = document.getElementById('apw-root');
    const lastUpdatedEl = document.getElementById('apw-last-updated');
    const cacheStatusEl = document.getElementById('apw-cache-status');
    const errorEl = document.getElementById('apw-error');
    const stateEl = document.getElementById('apw-state');
    const panels = {
      h1: document.getElementById('panel-h1'),
      d1: document.getElementById('panel-d1'),
      w1: document.getElementById('panel-w1')
    };
    const tabs = {
      h1: document.getElementById('tab-h1'),
      d1: document.getElementById('tab-d1'),
      w1: document.getElementById('tab-w1')
    };
    const sortSelect = document.getElementById('apw-sort-select');
    const btnRefresh = document.getElementById('apw-refresh-btn');
    const btnContrast = document.getElementById('apw-contrast-btn');

    // Data
    let data = safeParseJson('apw-initial') || { h1: [], d1: [], w1: [] };
    let activeTf = 'h1';

    function safeParseJson(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      try { return JSON.parse(el.textContent); } catch (e) { return null; }
    }

    function bandFromScore(s) {
      if (s > 85) return 'extreme';
      if (s >= 70) return 'strong';
      return 'watch';
    }

    function riskOrder(r) { return r === 'Low' ? 0 : r === 'Medium' ? 1 : 2; }

    function sortItems(tf, items) {
      const key = sortSelect.value || 'score';
      const copy = [...items];
      switch (key) {
        case 'score': copy.sort((a,b) => (b.score||0) - (a.score||0)); break;
        case 'risk': copy.sort((a,b) => riskOrder(a.risk_label||'High') - riskOrder(b.risk_label||'High') || (b.score||0)-(a.score||0)); break;
        case 'volume': copy.sort((a,b) => (b.volume_24h||0) - (a.volume_24h||0)); break;
        case 'price': copy.sort((a,b) => (b.price||0) - (a.price||0)); break;
        case 'symbol': copy.sort((a,b) => String(a.symbol||'').localeCompare(String(b.symbol||''))); break;
      }
      return copy.slice(0, 10);
    }

    function makeSparkline(values, w=220, h=38, stroke='#22c55e') {
      if (!values || values.length < 2) values = [0,1];
      const min = Math.min(...values), max = Math.max(...values);
      const norm = v => max === min ? 0.5*h : h - ((v - min) / (max - min)) * h;
      const step = (w - 6) / (values.length - 1);
      let d = '';
      values.forEach((v,i) => { const x=3 + i*step, y=norm(v); d += (i? ' L':'M') + x + ' ' + y; });
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" vector-effect="non-scaling-stroke" />
      </svg>`;
    }

    function fmtNum(n, digits=2) {
      if (n === undefined || n === null || Number.isNaN(n)) return '—';
      const abs = Math.abs(n);
      if (abs >= 1e9) return (n/1e9).toFixed(2)+'B';
      if (abs >= 1e6) return (n/1e6).toFixed(2)+'M';
      if (abs >= 1e3) return (n/1e3).toFixed(2)+'K';
      return n.toFixed(digits);
    }

    function renderRow(item) {
      const band = bandFromScore(item.score||0);
      const risk = item.risk_label || 'Medium';
      const spark = makeSparkline(item.sparkline||[]);
      const signals = Array.isArray(item.signals_fired) ? item.signals_fired.slice(0,3) : [];
      return `
        <div class="apw-row" role="article" aria-label="${escapeHtml(item.name||item.symbol||'Asset')}">
          <div class="apw-main">
            <div class="apw-topline">
              <div class="apw-coin">
                <span>${escapeHtml(item.name||'Unknown')}</span>
                <span class="apw-symbol">${escapeHtml(item.symbol||'')}</span>
                <span class="apw-source">coingecko</span>
              </div>
              <div class="apw-score" data-band="${band}" title="Composite score">${(item.score||0).toFixed(0)}</div>
            </div>
            <div class="apw-midline">
              <div class="apw-spark">
                ${spark}
              </div>
              <div class="apw-stats">
                <div class="apw-stat"><span>Price</span><strong>$${fmtNum(item.price, 4)}</strong></div>
                <div class="apw-stat"><span>24h Volume</span><strong>$${fmtNum(item.volume_24h, 0)}</strong></div>
                <div class="apw-stat"><span>Predicted Move</span><strong>${fmtNum(item.predicted_move_pct,1)}%</strong></div>
                <div class="apw-stat"><span>Risk</span><strong class="apw-risk" data-level="${risk}">${risk}</strong></div>
              </div>
            </div>
            <div class="apw-tags" aria-label="Signals">
              ${signals.map(s => `<span class="apw-tag">${escapeHtml(s)}</span>`).join('')}
            </div>
          </div>
          <div class="apw-side">
            <a class="apw-cta" href="${escapeAttr(item.cta_url||'#')}" target="_blank" rel="noopener">View full analytics →</a>
          </div>
        </div>
      `;
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '"'); }

    function render(tf) {
      const panel = panels[tf];
      const items = Array.isArray(data[tf]) ? data[tf] : [];
      panel.innerHTML = '';
      if (!items.length) {
        panel.innerHTML = `<div class="apw-empty">No candidates yet. Data will load shortly.</div>`;
        return;
      }
      const sorted = sortItems(tf, items);
      const html = sorted.map(renderRow).join('');
      panel.innerHTML = html;
    }

    function setActive(tf) {
      activeTf = tf;
      Object.keys(panels).forEach(k => {
        panels[k].hidden = (k !== tf);
        tabs[k].setAttribute('aria-selected', k === tf ? 'true' : 'false');
      });
      render(tf);
    }

    // Event bindings
    tabs.h1.addEventListener('click', () => setActive('h1'));
    tabs.d1.addEventListener('click', () => setActive('d1'));
    tabs.w1.addEventListener('click', () => setActive('w1'));
    sortSelect.addEventListener('change', () => render(activeTf));
    btnRefresh.addEventListener('click', () => {
      stateEl.textContent = 'Refreshed';
      render(activeTf);
      setTimeout(() => stateEl.textContent = 'Ready', 800);
    });
    btnContrast.addEventListener('click', () => {
      const html = document.documentElement;
      html.setAttribute('data-contrast', html.getAttribute('data-contrast') === 'high' ? 'normal' : 'high');
    });

    // Initial mount
    (function init() {
      try {
        lastUpdatedEl.textContent = `(last updated: ${new Date().toLocaleString()})`;
        cacheStatusEl.textContent = 'Inline dataset';
        errorEl.hidden = true;
        setActive('h1'); // renders Hourly immediately
        // Sanity: ensure visible panel has non-zero height (min-height CSS guards this)
        const rect = panels.h1.getBoundingClientRect();
        if (rect.height < 10) {
          panels.h1.style.minHeight = '140px';
        }
      } catch (e) {
        errorEl.hidden = false;
        errorEl.textContent = `Render error: ${e.message}`;
      }
    })();

  })();
  </script>
</body>
